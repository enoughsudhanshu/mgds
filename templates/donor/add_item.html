{% extends "base.html" %}
{% block title %}Add Item{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">List a New Donation</h3>
                <!-- enctype zaroori hai file upload ke liye! -->
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input type="text" name="item_name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="medicine">Medicine</option>
                            <option value="goods">Goods (Essential Supplies)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Expiry Date (if applicable)</label>
                        <input type="date" name="expiry_date" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Upload Photo</label>
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-success w-100">Submit Donation</button>
                </form>
                <a href="{{ url_for('donor.dashboard') }}" class="btn btn-link mt-2">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
